services:
    mgdb:
        image: "postgres:14.1-alpine"
        restart: unless-stopped
        environment:
            POSTGRES_PASSWORD: postgres
            TZ: America/Cuiaba
        volumes:
            - /opt/www:/opt/www
            - .:/home/host
            - ./.db/data:/var/lib/postgresql/data
            #- ./pg_hba.dev.conf:/var/lib/postgresql/data/pg_hba.conf
            - /tmp:/tmp/host
        ports:
            - "5432:5432"
        extra_hosts:
            - "host.docker.internal:host-gateway"
