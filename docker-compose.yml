
services:
    mgdb:
        image: "postgres:14.1-alpine"
        restart: unless-stopped

        mem_limit: 24g
        cpus: 24

        environment:
            POSTGRES_PASSWORD: postgres
            TZ: America/Cuiaba
        volumes:
            - /opt/www:/opt/www
            - .:/home/host
            - ./.db/data:/var/lib/postgresql/data
            - /tmp:/tmp/host
        ports:
            - "5432:5432"
        extra_hosts:
            - "host.docker.internal:host-gateway"

